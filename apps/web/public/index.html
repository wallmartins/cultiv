<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cultiv — em breve</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #0d0d0d;
        --ink: #e8e8e8;
        --muted: #9e9e9e;
        --accent: #abe841;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      h1 {
        font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(2.4rem, 8vw, 3.6rem);
        letter-spacing: 0.01em;
      }
      p { color: var(--muted); font-size: 1rem; max-width: 34ch; line-height: 1.5; }
      a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--muted); padding-bottom: 2px; }
      a:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <svg width="76" height="76" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <defs>
          <path id="q" d="M62 38c0-9.5-7-16-15.5-16C38 22 32 28.2 32 36.2c0 7.9 6 13.8 14 13.8 1.1 0 2.2-.1 3.2-.4C48 60 42.2 65.6 34.6 68.2l3.4 6.8C50.6 70.6 62 59.6 62 43.6Z" />
        </defs>
        <circle cx="48" cy="48" r="37" stroke="#e8e8e8" stroke-width="5" />
        <path d="M54.4 11.6A37 37 0 0 1 78.3 26.8" stroke="#abe841" stroke-width="5" />
        <use href="#q" transform="translate(26.5 31.6) scale(0.62) translate(-32 -22)" fill="#e8e8e8" />
        <use href="#q" transform="translate(51 31.6) scale(0.62) translate(-32 -22)" fill="#e8e8e8" />
      </svg>
      <h1>Cultiv</h1>
      <p>O app está voltando. Enquanto isso, a calibração e a geração seguem em construção.</p>
      <a href="https://www.cultiv.app">← cultiv.app</a>
    </main>
  </body>
</html>
