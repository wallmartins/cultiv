<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cultiv — em breve</title>
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="O aplicativo do Cultiv está em construção. Em breve, aqui."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0b0b0d;
        color: #f4f2ec;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        text-align: center;
      }
      main {
        max-width: 34ch;
        display: grid;
        gap: 1rem;
      }
      .mark {
        font-size: clamp(2.5rem, 8vw, 4rem);
        letter-spacing: -0.02em;
        font-weight: 500;
      }
      p {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        color: #a8a49a;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f4f2ec;
        margin: 0.5rem auto 0;
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Cultiv</div>
      <p>O aplicativo está sendo cultivado. Em breve, aqui.</p>
      <span class="dot" aria-hidden="true"></span>
    </main>
  </body>
</html>
