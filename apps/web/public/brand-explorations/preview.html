<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>Cultiv — Marca Viva</title>
    <style>
      body { margin: 0; padding: 2rem; font-family: system-ui, sans-serif; background: #f3f0ea; color: #1a1a18; }
      h1 { font-size: 1.125rem; margin-bottom: 0.25rem; }
      p { color: #6b6860; margin-top: 0; margin-bottom: 2rem; max-width: 40rem; line-height: 1.6; }
      .row { display: flex; flex-wrap: wrap; gap: 2rem; align-items: end; margin-bottom: 2rem; }
      .cell { text-align: center; }
      .cell span { display: block; margin-top: 0.5rem; font-size: 0.6875rem; color: #6b6860; }
      .dark { background: #1a1a18; padding: 1.5rem; border-radius: 2px; display: inline-block; }
    </style>
  </head>
  <body>
    <h1>Marca Viva — gota + arco de assinatura</h1>
    <p>
      Narrativa: uma gota de tinta deixa um rastro único — <em>sua voz deixa marca</em>.
      Silhueta reconhecível sem letras, ticks ou sulcos abstratos.
    </p>
    <div class="row">
      <div class="cell"><img src="/brand-explorations/marca-viva-compact.svg" width="16" height="16" alt="" /><span>16px compact</span></div>
      <div class="cell"><img src="/brand-explorations/marca-viva-compact.svg" width="24" height="24" alt="" /><span>24px</span></div>
      <div class="cell"><img src="/brand-explorations/marca-viva-compact.svg" width="32" height="32" alt="" /><span>32px</span></div>
      <div class="cell"><img src="/cultiv-compass-mark.svg" width="48" height="48" alt="" /><span>48px balanced</span></div>
      <div class="cell"><img src="/brand-explorations/marca-viva-bold.svg" width="64" height="64" alt="" /><span>64px bold</span></div>
    </div>
    <div class="dark"><img src="/cultiv-compass-mark.svg" width="48" height="48" alt="Cultiv" /></div>
  </body>
</html>
