name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      run_backend: ${{ steps.targets.outputs.run_backend }}
      run_web: ${{ steps.targets.outputs.run_web }}
      run_durable: ${{ steps.targets.outputs.run_durable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vitest.config.ts'
              - 'tsconfig*.json'
              - 'packages/**'
              - '!packages/ui/**'
              - '.github/**'
              - 'scripts/**'
              - 'tests/vitest.setup.ts'
              - 'tests/fixtures/**'
              - 'tests/governance/**'
              - 'tests/contracts/**'
              - 'tests/core/**'
              - 'tests/domain/**'
              - 'tests/features/**'
              - 'tests/text-quality/**'
              - 'tests/build/**'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'tests/web/**'
              - 'tests/governance/frontend-client-boundary.test.ts'
            backend:
              - 'apps/backend/**'
              - 'tests/backend/**'
              - 'tests/payments/**'
              - 'tests/client-sdk/**'
              - 'apps/backend/tests/**'
              - 'infra/**'

      - name: Select CI targets
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
            echo "run_web=true" >> "$GITHUB_OUTPUT"
            echo "run_durable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          shared="${{ steps.filter.outputs.shared }}"
          web="${{ steps.filter.outputs.web }}"
          backend="${{ steps.filter.outputs.backend }}"

          if [ "$shared" = "true" ] || [ "$backend" = "true" ]; then
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_backend=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$shared" = "true" ] || [ "$web" = "true" ]; then
            echo "run_web=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_web=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$shared" = "true" ] || [ "$backend" = "true" ]; then
            echo "run_durable=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_durable=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm lint

  test:
    name: Unit tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      # Sharded across 4 runners: file collection + transform (not raw test execution) dominates
      # wall time on CI's smaller CPUs, and --shard splits that cost across parallel jobs instead of
      # one runner paying it for all ~280 files serially-parallel.
      - name: Full unit suite
        if: needs.changes.outputs.shared == 'true' || (needs.changes.outputs.web == 'true' && needs.changes.outputs.backend == 'true')
        run: pnpm test:ci -- --shard=${{ matrix.shard }}/4
      - name: Backend unit suite
        if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.web != 'true' && needs.changes.outputs.shared != 'true'
        run: pnpm test:ci:backend -- --shard=${{ matrix.shard }}/4
      # Small suites (~20 files): sharding would just multiply fixed checkout/install overhead
      # for no wall-clock gain, so only shard 1 runs them, unsharded.
      - name: Web unit suite
        if: matrix.shard == 1 && needs.changes.outputs.web == 'true' && needs.changes.outputs.backend != 'true' && needs.changes.outputs.shared != 'true'
        run: pnpm test:ci:web
      - name: Smoke tests (docs-only / out-of-scope diffs)
        if: matrix.shard == 1 && needs.changes.outputs.shared != 'true' && needs.changes.outputs.web != 'true' && needs.changes.outputs.backend != 'true'
        run: pnpm smoke

  eval:
    name: Eval — Voice Fidelity
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm eval:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: packages/eval/dist/eval-report.json
          if-no-files-found: ignore

  build-backend:
    name: Build backend
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm build:backend
      - name: Prune stale migration bundles
        run: bash infra/integrator/scripts/prune-stale-migration-bundles.sh apps/backend/dist apps/backend/src/infra/migrations
      - name: Upload deploy artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          retention-days: 3
          path: |
            apps/backend/dist
            apps/backend/policies
            packages/*/dist
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            infra/integrator/configs/ecosystem.config.cjs

  build-web:
    name: Build web
    needs: changes
    if: needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm build:web

  durable-runtime:
    name: Durable runtime
    needs: changes
    if: needs.changes.outputs.run_durable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contentlib
          POSTGRES_PASSWORD: contentlib
          POSTGRES_DB: contentlib
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentlib -d contentlib"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run durable runtime integration tests
        env:
          RUN_DURABLE_RUNTIME_TESTS: "true"
          RUN_POSTGRES_TESTS: "true"
          BACKEND_TEST_DATABASE_URL: postgresql://contentlib:contentlib@localhost:5432/contentlib
          REDIS_URL: redis://localhost:6379
          BACKEND_ALLOW_IN_MEMORY_RUNTIME: "false"
        run: pnpm test:durable

  eval-nightly:
    name: Eval — Nightly (with Voice Judge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm eval:nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-nightly-report
          path: packages/eval/dist/eval-report.json
          if-no-files-found: ignore

  deploy-vps:
    name: Deploy VPS
    needs: [changes, lint, test, eval, build-backend, durable-runtime]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.run_backend == 'true' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.eval.result == 'success' &&
      needs.build-backend.result == 'success' &&
      (needs.durable-runtime.result == 'success' || needs.durable-runtime.result == 'skipped')
    runs-on: [self-hosted, integrator]
    timeout-minutes: 20
    env:
      CULTIV_ROOT: ${{ vars.CULTIV_ROOT }}
      CULTIV_APP: ${{ vars.CULTIV_APP }}
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: /tmp/deploy-artifact
      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          export ARTIFACT_DIR=/tmp/deploy-artifact
          export CHECKOUT_DIR="$GITHUB_WORKSPACE"
          export CULTIV_ROOT="${CULTIV_ROOT:-}"
          export CULTIV_APP="${CULTIV_APP:-}"
          bash infra/integrator/scripts/deploy-app.sh
          rm -rf /tmp/deploy-artifact
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            if [ "${{ job.status }}" == "success" ]; then
              curl -s -X POST -H "Content-Type: application/json" \
                -d "{\"content\": \"✅ Cultiv deploy successful: $(date)\"}" \
                "$DISCORD_WEBHOOK" > /dev/null || true
            else
              curl -s -X POST -H "Content-Type: application/json" \
                -d "{\"content\": \"🚨 Cultiv deploy FAILED: $(date)\"}" \
                "$DISCORD_WEBHOOK" > /dev/null || true
            fi
          fi

  ci-gate:
    name: CI gate
    needs:
      - changes
      - lint
      - test
      - eval
      - build-backend
      - build-web
      - durable-runtime
      - deploy-vps
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate CI results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EVAL_RESULT: ${{ needs.eval.result }}
          BUILD_BACKEND_RESULT: ${{ needs.build-backend.result }}
          BUILD_WEB_RESULT: ${{ needs.build-web.result }}
          DURABLE_RESULT: ${{ needs.durable-runtime.result }}
          DEPLOY_RESULT: ${{ needs.deploy-vps.result }}
          RUN_BACKEND: ${{ needs.changes.outputs.run_backend }}
          RUN_WEB: ${{ needs.changes.outputs.run_web }}
          RUN_DURABLE: ${{ needs.changes.outputs.run_durable }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          ok_or_skipped() {
            case "$1" in
              success|skipped) return 0 ;;
              *) return 1 ;;
            esac
          }

          require_success() {
            local label="$1"
            local result="$2"
            if ok_or_skipped "$result"; then
              echo "✓ $label ($result)"
              return 0
            fi
            echo "✗ $label ($result)"
            exit 1
          }

          require_when_enabled() {
            local enabled="$1"
            local label="$2"
            local result="$3"
            if [ "$enabled" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "✗ $label required but finished as $result"
                exit 1
              fi
              echo "✓ $label (success)"
              return 0
            fi
            require_success "$label" "$result"
          }

          echo "Validating CI gate..."

          require_success "Path filter" "$CHANGES_RESULT"
          require_success "Lint" "$LINT_RESULT"
          require_success "Test" "$TEST_RESULT"
          require_success "Eval" "$EVAL_RESULT"
          require_when_enabled "$RUN_BACKEND" "Build backend" "$BUILD_BACKEND_RESULT"
          require_when_enabled "$RUN_WEB" "Build web" "$BUILD_WEB_RESULT"
          require_when_enabled "$RUN_DURABLE" "Durable runtime" "$DURABLE_RESULT"

          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ] && [ "$RUN_BACKEND" = "true" ]; then
            if [ "$DEPLOY_RESULT" != "success" ]; then
              echo "✗ Deploy VPS required on main but finished as $DEPLOY_RESULT"
              exit 1
            fi
            echo "✓ Deploy VPS (success)"
          else
            require_success "Deploy VPS" "$DEPLOY_RESULT"
          fi

          echo "CI gate passed."

      - name: Write summary
        if: always()
        shell: bash
        env:
          RUN_BACKEND: ${{ needs.changes.outputs.run_backend }}
          RUN_WEB: ${{ needs.changes.outputs.run_web }}
          RUN_DURABLE: ${{ needs.changes.outputs.run_durable }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EVAL_RESULT: ${{ needs.eval.result }}
          BUILD_BACKEND_RESULT: ${{ needs.build-backend.result }}
          BUILD_WEB_RESULT: ${{ needs.build-web.result }}
          DURABLE_RESULT: ${{ needs.durable-runtime.result }}
          DEPLOY_RESULT: ${{ needs.deploy-vps.result }}
          GATE_OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## CI gate"
            echo ""
            echo "| Target | Scheduled | Result |"
            echo "|--------|-----------|--------|"
            echo "| Lint | always | $LINT_RESULT |"
            echo "| Unit tests | always | $TEST_RESULT |"
            echo "| Eval | always | $EVAL_RESULT |"
            echo "| Build backend | $RUN_BACKEND | $BUILD_BACKEND_RESULT |"
            echo "| Build web | $RUN_WEB | $BUILD_WEB_RESULT |"
            echo "| Durable runtime | $RUN_DURABLE | $DURABLE_RESULT |"
            echo "| Deploy VPS | main + backend | $DEPLOY_RESULT |"
            echo ""
            echo "**Gate:** $GATE_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

# Branch protection / Vercel: require only the **CI gate** check on main and PRs.
#
# Path rules (dorny/paths-filter):
#   shared (packages, lockfile, CI, most tests) → backend + web + durable
#   web only (apps/web, packages/ui, tests/web) → web build + web tests
#   backend only (apps/backend, backend tests, infra) → backend build + durable + backend tests
#   docs-only → lint + smoke only; no deploy
