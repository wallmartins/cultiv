name: Deploy to Integrator VPS (manual)

# Production deploys run from ci.yml (deploy-vps job) after lint + test + build + durable-runtime.
# This workflow is a manual escape hatch only.

on:
  workflow_dispatch:
    inputs:
      skip_ci_acknowledgement:
        description: "I confirm CI is green on the target commit"
        required: true
        type: boolean
        default: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit acknowledgement
        if: inputs.skip_ci_acknowledgement != true
        run: |
          echo "Refuse manual deploy without skip_ci_acknowledgement."
          echo "Prefer pushing to main and letting ci.yml deploy after tests pass."
          exit 1

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm build:backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist-manual
          path: |
            apps/backend/dist
            apps/backend/policies
            packages/*/dist
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml

  deploy:
    needs: build
    runs-on: [self-hosted, integrator]
    env:
      CULTIV_ROOT: ${{ vars.CULTIV_ROOT }}
      CULTIV_APP: ${{ vars.CULTIV_APP }}
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-manual
          path: /tmp/deploy-artifact
      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          export ARTIFACT_DIR=/tmp/deploy-artifact
          export CULTIV_ROOT="${CULTIV_ROOT:-}"
          export CULTIV_APP="${CULTIV_APP:-}"
          bash infra/integrator/scripts/deploy-app.sh
          rm -rf /tmp/deploy-artifact
