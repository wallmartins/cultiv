name: Deploy to Integrator VPS (manual)

# Production deploys run from ci.yml (deploy-vps job) after lint + test + build + durable-runtime.
# This workflow is a manual escape hatch only.

on:
  workflow_dispatch:
    inputs:
      skip_ci_acknowledgement:
        description: "I confirm CI is green on the target commit"
        required: true
        type: boolean
        default: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit acknowledgement
        if: inputs.skip_ci_acknowledgement != true
        run: |
          echo "Refuse manual deploy without skip_ci_acknowledgement."
          echo "Prefer pushing to main and letting ci.yml deploy after tests pass."
          exit 1

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - run: pnpm build:backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist-manual
          path: |
            apps/backend/dist
            apps/backend/policies
            packages/*/dist
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml

  deploy:
    needs: build
    runs-on: [self-hosted, integrator]
    env:
      CULTIV_ROOT: ${{ vars.CULTIV_ROOT }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-manual
          path: /tmp/deploy-artifact
      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          cd ${CULTIV_ROOT:-/home/cultiv/cultiv}/app
          if [ -d apps/backend/dist ]; then
            mv apps/backend/dist "apps/backend/dist.bak.$(date +%F-%H%M)"
          fi
          cp -r /tmp/deploy-artifact/apps/backend/dist apps/backend/dist
          cp -r /tmp/deploy-artifact/apps/backend/policies apps/backend/policies
          for pkg in /tmp/deploy-artifact/packages/*/dist; do
            pkg_name=$(basename "$(dirname "$pkg")")
            mkdir -p "packages/$pkg_name/dist"
            cp -r "$pkg"/* "packages/$pkg_name/dist/" 2>/dev/null || true
          done
          pnpm install --prod --frozen-lockfile
          pnpm --filter @my-ai-orchestrator/backend migrate
          pm2 reload ecosystem.config.cjs --only cultiv-api
          pm2 restart ecosystem.config.cjs --only cultiv-worker
          sleep 5
          curl -f http://127.0.0.1:3001/health || exit 1
          rm -rf /tmp/deploy-artifact
