services:
  postgres:
    image: postgres:16-alpine
    container_name: cultiv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cultiv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-cultiv}
    volumes:
      - /home/ubuntu/cultiv/data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cultiv} -d ${POSTGRES_DB:-cultiv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cultiv-redis
    command: redis-server --appendonly yes
    volumes:
      - /home/ubuntu/cultiv/data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
