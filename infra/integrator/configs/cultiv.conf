# =============================================================================
# Cultiv — Configuração de Ambiente
# =============================================================================
# Este arquivo define variáveis compartilhadas entre todos os scripts de deploy.
# Copie para /home/cultiv/cultiv/config/cultiv.conf (ou ajuste o caminho).
# =============================================================================

# Usuário que roda o projeto (pode ser ubuntu, cultiv, ou outro)
export CULTIV_USER="${CULTIV_USER:-cultiv}"

# Diretório raiz do projeto
export CULTIV_ROOT="/home/${CULTIV_USER}/cultiv"

# Subdiretórios
export CULTIV_APP="${CULTIV_ROOT}/app"
export CULTIV_DATA="${CULTIV_ROOT}/data"
export CULTIV_LOGS="${CULTIV_ROOT}/logs"
export CULTIV_METRICS="${CULTIV_ROOT}/metrics"
export CULTIV_SCRIPTS="${CULTIV_ROOT}/scripts"
export CULTIV_BACKUPS="${CULTIV_ROOT}/backups"
export CULTIV_CONFIG="${CULTIV_ROOT}/config"

# Portas
export API_PORT=3001
export WORKER_PORT=3002
export NGINX_PORT=80
export POSTGRES_PORT=5432
export REDIS_PORT=6379
