document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n: reduce) {\n    details[data-faq] [data-sign] { transition:none; }\n    details[data-faq][open] [data-answer] { animation:none; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:var(--t-bg, #F8F7F4); color:var(--t-ink, #34322E); font-family:'Mona Sans','Helvetica Neue',Arial,sans-serif;\">\n\n  <!-- ============ NAV FIXO (CTA persistente desde o frame 0) ============ -->\n  <nav aria-label=\"Principal\" style=\"position:fixed; top:0; left:0; right:0; z-index:40; display:flex; align-items:center; justify-content:space-between; padding:14px clamp(16px,4vw,40px); background:{{ navBg }}; box-shadow:{{ navLine }}; backdrop-filter:{{ navBlur }}; -webkit-backdrop-filter:{{ navBlur }}; opacity:{{ navOp }}; transition:background-color 0.35s ease, box-shadow 0.35s ease, opacity 0.7s ease;\">\n    <a ref=\"{{ navBrandRef }}\" href=\"#\" sc-camel-on-click=\"{{ goTop }}\" aria-label=\"Cultiv — início\" style=\"display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--t-ink, #34322E);\">\n      <svg data-cultiv-nav-brand=\"true\" width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 96 96\" fill=\"none\" aria-hidden=\"true\" style=\"display:block; opacity:{{ navLogoOp }}; transition:opacity 0.25s ease;\">\n        <defs><path id=\"navQ\" d=\"M62 38c0-9.5-7-16-15.5-16C38 22 32 28.2 32 36.2c0 7.9 6 13.8 14 13.8 1.1 0 2.2-.1 3.2-.4C48 60 42.2 65.6 34.6 68.2l3.4 6.8C50.6 70.6 62 59.6 62 43.6Z\"><\u002Fpath><\u002Fdefs>\n        <circle cx=\"48\" cy=\"48\" r=\"37\" stroke=\"#151515\" stroke-width=\"5\" style=\"stroke:var(--t-logoink, #151515);\"><\u002Fcircle>\n        <path d=\"M54.4 11.6A37 37 0 0 1 78.3 26.8\" stroke=\"#95CB3E\" stroke-width=\"5\"><\u002Fpath>\n        <use href=\"#navQ\" transform=\"translate(26.5 31.6) scale(0.62) translate(-32 -22)\" fill=\"#151515\" style=\"fill:var(--t-logoink, #151515);\"><\u002Fuse>\n        <use href=\"#navQ\" transform=\"translate(51 31.6) scale(0.62) translate(-32 -22)\" fill=\"#151515\" style=\"fill:var(--t-logoink, #151515);\"><\u002Fuse>\n      <\u002Fsvg>\n      <span style=\"font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:1.15rem; letter-spacing:-0.01em;\">Cultiv<\u002Fspan>\n    <\u002Fa>\n    <button type=\"button\" sc-camel-on-click=\"{{ goDemo }}\" style=\"font-family:inherit; font-weight:600; font-size:0.95rem; color:var(--t-bg, #F8F7F4); background:var(--t-ink, #34322E); border:none; border-radius:10px; padding:10px 18px; cursor:pointer; transition:background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;\" style-hover=\"background:#A3DD42; color:#34322E;\" style-active=\"transform:translateY(1px);\">Testar a demo →<\u002Fbutton>\n  <\u002Fnav>\n\n  <!-- ============ INTRO PINADA (scroll-story em canvas) ============ -->\n  <section ref=\"{{ introRef }}\" data-screen-label=\"Hero — scroll story\" aria-label=\"Apresentação da Cultiv\" style=\"height:{{ introH }}; position:relative;\">\n    <div ref=\"{{ stickyRef }}\" style=\"position:sticky; top:0; height:100svh; overflow:hidden;\">\n      <canvas ref=\"{{ canvasRef }}\" aria-hidden=\"true\" style=\"position:absolute; inset:0; width:100%; height:100%; display:block;\"><\u002Fcanvas>\n\n      <!-- Copy real em HTML (SEO / leitores de tela) — legível desde p=0 -->\n      <div ref=\"{{ heroCopyRef }}\" style=\"position:absolute; left:50%; top:54%; transform:translate(-50%,-50%); text-align:center; max-width:min(90vw,760px); padding:clamp(24px,5vw,56px); background:radial-gradient(closest-side, rgba(248,247,244,0.96) 62%, rgba(248,247,244,0)); opacity:0; will-change:opacity,transform;\">\n        <h1 style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(2.6rem,7vw,5.1rem); line-height:1.04; letter-spacing:-0.015em; margin:0; color:#34322E; animation:{{ heroAnimH1 }};\">Escreve como você pensa.<\u002Fh1>\n        <p style=\"margin:18px 0 0; font-size:clamp(1.05rem,2.2vw,1.3rem); color:#6B675F; line-height:1.5; animation:{{ heroAnimSub }};\">Textos que são uma extensão de você. Não de um modelo.<\u002Fp>\n        <div style=\"display:flex; justify-content:center; margin-top:28px; animation:{{ heroAnimCta }};\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goDemo }}\" style=\"font-family:inherit; font-weight:600; font-size:1.05rem; color:#F8F7F4; background:#34322E; border:none; border-radius:10px; padding:14px 26px; cursor:pointer; transition:background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;\" style-hover=\"background:#A3DD42; color:#34322E;\" style-active=\"transform:translateY(1px);\">Testar a demo →<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:14px 0 0; font-size:0.85rem; color:#6B675F; letter-spacing:0.01em; animation:{{ heroAnimSup }};\">Descubra seu perfil de voz em poucos minutos · sem login · sem cadastro · 100% gratuito<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- Indicador de scroll -->\n      <div ref=\"{{ scrollHintRef }}\" aria-hidden=\"true\" style=\"position:absolute; left:0; right:0; bottom:26px; display:flex; justify-content:center; opacity:0; pointer-events:none; will-change:opacity;\">\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:8px; color:#6B675F; animation:{{ heroAnimSup }};\">\n          <span style=\"font-size:10.5px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase;\">Role para explorar<\u002Fspan>\n          <span style=\"width:22px; height:34px; border:1.5px solid #6B675F; border-radius:12px; display:flex; justify-content:center; padding-top:6px; box-sizing:border-box;\">\n            <span style=\"width:3px; height:7px; border-radius:3px; background:#6B675F; animation:cultivScrollDot 1.8s cubic-bezier(0.45,0,0.55,1) infinite;\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Overlays narrativos dos atos 2 e 3 -->\n      <p ref=\"{{ act2Ref }}\" aria-hidden=\"true\" style=\"display:{{ actDisplay }}; position:absolute; left:50%; bottom:14vh; transform:translate(-50%,14px); opacity:0; text-align:center; max-width:min(88vw,30ch); font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(1.35rem,3.3vw,2.2rem); line-height:1.25; letter-spacing:-0.01em; color:#34322E; margin:0; padding:10px 18px; background:radial-gradient(closest-side, rgba(248,247,244,0.92) 55%, rgba(248,247,244,0)); pointer-events:none; will-change:opacity,transform;\">A maioria das IAs transforma vozes únicas em textos que soam iguais.<\u002Fp>\n      <p ref=\"{{ act3Ref }}\" aria-hidden=\"true\" style=\"display:{{ actDisplay }}; position:absolute; left:50%; bottom:14vh; transform:translate(-50%,14px); opacity:0; text-align:center; max-width:min(88vw,30ch); font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(1.35rem,3.3vw,2.2rem); line-height:1.25; letter-spacing:-0.01em; color:#34322E; margin:0; padding:10px 18px; background:radial-gradient(closest-side, rgba(248,247,244,0.92) 55%, rgba(248,247,244,0)); pointer-events:none; will-change:opacity,transform;\">A Cultiv aprende o que torna a sua escrita única.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ATO 2: DEMO — \"Leia a minha escrita\" (DEMO-SPEC) ============ -->\n  <section ref=\"{{ demoRef }}\" id=\"demo\" data-screen-label=\"Demo — leia a minha escrita\" aria-label=\"Demo: leia a minha escrita\" style=\"min-height:100svh; display:grid; place-items:center; padding:clamp(72px,10vw,128px) clamp(20px,6vw,64px);\">\n    <div style=\"width:min(92vw,840px);\">\n      <h2 style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(2rem,4.6vw,3.2rem); line-height:1.12; letter-spacing:-0.012em; margin:0; color:var(--t-ink, #34322E); text-align:center; text-wrap:balance;\">Cole um parágrafo seu. Veja o que ele já entrega de você.<\u002Fh2>\n\n      <div style=\"margin-top:clamp(28px,4.5vw,44px); background:var(--t-surface, #FFFFFF); border:1px solid var(--t-line, rgba(52,50,46,0.1)); border-radius:16px; box-shadow:0 18px 50px -30px rgba(52,50,46,0.28); padding:clamp(20px,3.5vw,32px);\">\n        <label for=\"demoText\" style=\"display:block; font-weight:500; font-size:0.92rem; color:var(--t-muted, #6B675F); margin-bottom:10px;\">Escreva ou cole aqui algo que você mesmo escreveu — um e-mail, um post, um trecho.<\u002Flabel>\n        <textarea id=\"demoText\" value=\"{{ demoText }}\" sc-camel-on-change=\"{{ onDemoInput }}\" style=\"width:100%; min-height:150px; resize:vertical; font-family:inherit; font-size:0.98rem; line-height:1.6; color:var(--t-ink, #34322E); border:1px solid var(--t-line, rgba(52,50,46,0.16)); border-radius:10px; padding:14px 16px; background:var(--t-bg, #F8F7F4); box-sizing:border-box;\" style-focus=\"border-color:#95CB3E;\"><\u002Ftextarea>\n        <div style=\"margin-top:16px; display:flex; flex-direction:column; align-items:flex-start; gap:10px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onDemoRead }}\" style=\"font-family:inherit; font-weight:600; font-size:1rem; color:#34322E; background:#A3DD42; border:none; border-radius:10px; padding:13px 24px; cursor:pointer; transition:background-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;\" style-hover=\"background:#34322E; color:#F8F7F4; box-shadow:0 6px 22px -8px rgba(149,203,62,0.7); transform:translateY(-1px);\" style-active=\"transform:translateY(1px);\">Ler minha escrita →<\u002Fbutton>\n          <span style=\"font-size:0.82rem; color:var(--t-muted, #6B675F);\">Roda no seu navegador. Nada do que você escreve sai daqui. Sem cadastro.<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ demoError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p role=\"alert\" style=\"margin:14px 0 0; font-size:0.92rem; color:#C0653B;\">{{ demoError }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ demoHasReading }}\" hint-placeholder-val=\"{{ false }}\">\n        <div aria-live=\"polite\" style=\"margin-top:clamp(34px,5.5vw,56px);\">\n          <div style=\"display:flex; flex-direction:column; gap:14px;\">\n            <sc-for list=\"{{ demoLines }}\" as=\"line\" hint-placeholder-count=\"0\">\n              <p style=\"margin:0; font-family:'Instrument Serif',Georgia,serif; font-size:clamp(1.3rem,2.9vw,1.85rem); line-height:1.34; letter-spacing:-0.008em; color:var(--t-ink, #34322E); animation:{{ line.anim }}; text-wrap:pretty;\">\n                <sc-if value=\"{{ line.acid }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:rgba(163,221,66,0.5); box-decoration-break:clone; -webkit-box-decoration-break:clone; padding:1px 6px; border-radius:3px; color:#34322E;\">{{ line.text }}<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ line.plain }}\" hint-placeholder-val=\"{{ false }}\">{{ line.text }}<\u002Fsc-if>\n              <\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:26px; display:flex; flex-wrap:wrap; gap:10px; animation:{{ demoStripAnim }};\">\n            <sc-for list=\"{{ demoMetrics }}\" as=\"m\" hint-placeholder-count=\"0\">\n              <span style=\"display:inline-flex; align-items:baseline; gap:7px; border:1px solid var(--t-line, rgba(52,50,46,0.14)); border-radius:999px; padding:7px 14px; background:var(--t-surface, #FFFFFF);\">\n                <span style=\"font-family:'Fraunces',Georgia,serif; font-weight:560; font-variant-numeric:tabular-nums; font-size:1rem; color:var(--t-ink, #34322E);\">{{ m.value }}<\u002Fspan>\n                <span style=\"font-size:0.78rem; color:var(--t-muted, #6B675F);\">{{ m.label }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ demoTruncNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:12px 0 0; font-size:0.8rem; color:var(--t-muted, #6B675F);\">{{ demoTruncNote }}<\u002Fp>\n          <\u002Fsc-if>\n\n          <!-- moldura de fronteira: a demo lê a superfície; o Perfil vem da calibração -->\n          <div style=\"margin-top:clamp(34px,5vw,52px); border:1px solid var(--t-line, rgba(52,50,46,0.16)); border-radius:16px; padding:clamp(22px,3.5vw,34px); background:var(--t-surface, rgba(255,255,255,0.6)); animation:{{ demoFrameAnim }};\">\n            <h3 style=\"font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:clamp(1.3rem,2.6vw,1.7rem); letter-spacing:-0.01em; margin:0; color:var(--t-ink, #34322E);\">Isto é só a superfície.<\u002Fh3>\n            <p style=\"margin:12px 0 0; font-size:clamp(0.98rem,1.9vw,1.08rem); line-height:1.6; color:var(--t-muted, #6B675F); max-width:62ch;\">Ritmo, vocabulário, pontuação — o que um parágrafo revela. O seu Perfil de Voz completo vai além: como você pensa, argumenta e desenvolve uma ideia. A Cultiv aprende isso numa calibração de minutos — não de um texto colado.<\u002Fp>\n            <div style=\"margin-top:22px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;\">\n              <a href=\"https://auth.cultiv.app/signup\" style=\"display:inline-block; text-decoration:none; font-weight:600; font-size:1rem; color:#34322E; background:#A3DD42; border-radius:10px; padding:13px 24px; transition:background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;\" style-hover=\"background:#34322E; color:#F8F7F4; transform:translateY(-1px);\" style-active=\"transform:translateY(1px);\">Comece o teste grátis →<\u002Fa>\n              <button type=\"button\" sc-camel-on-click=\"{{ goConstellation }}\" style=\"background:none; border:none; padding:0; cursor:pointer; font-family:inherit; font-size:0.95rem; font-weight:500; color:var(--t-muted, #6B675F); text-decoration:underline; text-underline-offset:3px;\" style-hover=\"color:var(--t-ink, #34322E);\">ou veja a sua voz virar um mapa ↓<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ATO 3: CONSTELAÇÃO — \"Sua voz tem forma\" (CONSTELLATION-SPEC) ============ -->\n  <section ref=\"{{ constRef }}\" id=\"constelacao\" data-screen-label=\"Constelação — sua voz tem forma\" aria-label=\"Constelação: o Perfil de Voz virando geometria\" style=\"height:{{ cSectionH }}; position:relative; padding:{{ cSectionPad }}; box-sizing:border-box;\">\n    <div style=\"position:{{ cStickyPos }}; top:0; height:{{ cStickyH }}; overflow:hidden; border-radius:{{ cFrameRadius }}; background:{{ cFrameBg }}; border:{{ cFrameBorder }};\">\n      <div ref=\"{{ cRiseRef }}\" style=\"position:absolute; inset:0; opacity:{{ cRiseOp0 }}; will-change:transform,opacity;\">\n        <canvas ref=\"{{ cCanvasRef }}\" role=\"img\" aria-label=\"Sintetizador harmônico do Perfil de Voz: três ondas — Tom, Ritmo e Emoção — se entrelaçam da esquerda para a direita. Treze nós modulam as ondas: formalidade, humor, pessoalidade, vocabulário, metáforas, cadência, pontuação, estrutura, respiração, convicção, raciocínio, argumentação e audiência. Passe pelos nós para ver cada traço; arraste um pilar para ajustar a intensidade.\" style=\"position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y;\"><\u002Fcanvas>\n\n        <!-- overlay do sintetizador: header, pilares-fader, tooltip e micro-CTA -->\n        <div ref=\"{{ cLegendRef }}\" style=\"position:absolute; inset:0; z-index:3; opacity:{{ cLegendOp0 }}; pointer-events:none; will-change:opacity,transform;\">\n          <div style=\"position:absolute; left:clamp(20px,4.5vw,56px); top:clamp(38px,8vh,84px); max-width:min(86vw,420px);\">\n            <span style=\"display:flex; align-items:center; gap:9px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10.5px; letter-spacing:0.09em; color:#B7B2A8;\"><span style=\"width:7px; height:7px; border-radius:999px; background:#A3DD42; display:inline-block; box-shadow:0 0 10px rgba(163,221,66,0.7);\"><\u002Fspan>MAPA DA VOZ · 13 TRAÇOS · 3 PILARES<\u002Fspan>\n            <h2 style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(1.7rem,3.4vw,2.6rem); line-height:1.06; letter-spacing:-0.012em; margin:12px 0 0; color:#F1EFE9; text-wrap:balance;\">A sua voz é uma frequência única.<\u002Fh2>\n            <p style=\"margin:10px 0 0; font-size:clamp(0.9rem,1.6vw,1rem); line-height:1.55; color:#B7B2A8; text-wrap:pretty;\">Treze traços modulam três pilares. Passe pelos nós para senti-los vibrar; arraste um pilar, como num equalizador, para ouvi-lo mais alto.<\u002Fp>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ sPillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div ref=\"{{ p.ref }}\" sc-camel-on-pointer-down=\"{{ p.down }}\" role=\"slider\" aria-label=\"Pilar {{ p.label }} — arraste para cima ou para baixo para ajustar a intensidade\" style=\"position:absolute; left:clamp(16px,3vw,44px); top:{{ p.topCss }}; pointer-events:auto; display:flex; align-items:center; gap:9px; padding:9px 14px; border:1px solid rgba(241,239,233,0.22); border-radius:999px; background:rgba(244,242,235,0.06); backdrop-filter:blur(10px) saturate(1.15); -webkit-backdrop-filter:blur(10px) saturate(1.15); cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; will-change:transform; transition:border-color 0.2s ease, background-color 0.2s ease;\" style-hover=\"border-color:rgba(241,239,233,0.5); background:rgba(244,242,235,0.11);\">\n              <span style=\"width:8px; height:8px; border-radius:999px; background:{{ p.color }}; box-shadow:0 0 10px {{ p.glow }};\"><\u002Fspan>\n              <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10.5px; letter-spacing:0.09em; color:#F1EFE9;\">{{ p.label }}<\u002Fspan>\n              <span aria-hidden=\"true\" style=\"display:flex; flex-direction:column; gap:1px; margin-left:2px; opacity:0.55;\">\n                <span style=\"width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-bottom:5px solid #F1EFE9;\"><\u002Fspan>\n                <span style=\"width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid #F1EFE9;\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div aria-live=\"polite\" style=\"position:absolute; left:0; top:0; max-width:268px; padding:13px 16px 15px; border:1px solid rgba(241,239,233,0.18); border-radius:14px; background:rgba(24,23,20,0.58); backdrop-filter:blur(18px) saturate(1.25); -webkit-backdrop-filter:blur(18px) saturate(1.25); box-shadow:0 22px 60px -20px rgba(0,0,0,0.65), inset 0 1px 0 rgba(241,239,233,0.09); pointer-events:none; opacity:{{ sTipOp }}; transform:translate3d({{ sTipX }}px, {{ sTipY }}px, 0) scale({{ sTipScale }}); transform-origin:0 100%; transition:opacity 0.28s ease, transform 0.38s cubic-bezier(0.22,1,0.36,1); will-change:transform,opacity;\">\n            <span style=\"display:flex; align-items:center; gap:8px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:9.5px; letter-spacing:0.11em; color:{{ sTipColor }};\"><span style=\"width:6px; height:6px; border-radius:999px; background:{{ sTipColor }}; box-shadow:0 0 8px {{ sTipGlow }}; display:inline-block;\"><\u002Fspan>PILAR · {{ sTipPillar }}<\u002Fspan>\n            <h3 style=\"margin:8px 0 0; font-family:'Fraunces',Georgia,serif; font-weight:560; font-size:1.12rem; letter-spacing:-0.008em; color:#F1EFE9;\">{{ sTipLabel }}<\u002Fh3>\n            <p style=\"margin:6px 0 0; font-size:0.84rem; line-height:1.55; color:#B7B2A8;\">{{ sTipDesc }}<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"position:absolute; right:clamp(20px,4.5vw,56px); bottom:clamp(16px,4vh,42px); text-align:right; pointer-events:auto;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ cGoNext }}\" style=\"background:none; border:none; padding:0; cursor:pointer; font-family:inherit; font-size:0.92rem; font-weight:500; color:#F1EFE9; text-decoration:underline; text-underline-offset:4px; text-decoration-color:rgba(163,221,66,0.75); transition:color 0.2s ease; text-align:right;\" style-hover=\"color:#A3DD42;\">A sua não se parece com nenhuma outra → ver como<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- dica de interação -->\n        <div ref=\"{{ cKeyRef }}\" aria-hidden=\"true\" style=\"position:absolute; left:50%; bottom:clamp(14px,3vh,30px); transform:translateX(-50%); display:{{ cKeyDisplay }}; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; letter-spacing:0.09em; color:rgba(183,178,168,0.66); z-index:2; opacity:{{ cLegendOp0 }}; pointer-events:none; white-space:nowrap;\">passe pelos nós · arraste os pilares<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- handoff (Fix F): a semente que abre a respiração (Ato 4) — agora o bonequinho guia -->\n  <div aria-hidden=\"true\" style=\"display:{{ cHandoffDisplay }}; height:24vh; align-items:flex-start; justify-content:center; padding-top:48px;\">\n    <span ref=\"{{ cSeedRef }}\" style=\"display:none; width:10px; height:10px; border-radius:999px; background:#95CB3E; box-shadow:0 0 20px rgba(149,203,62,0.55); opacity:0;\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ============ ATO 4: RESPIRAÇÃO — \"A sua voz não cabe na pressa\" (BREATH-SPEC) ============ -->\n  <section ref=\"{{ breathRef }}\" id=\"respiracao\" data-screen-label=\"Respiração — a sua voz não cabe na pressa\" aria-label=\"Respiração: o respiro que quebra a pressa\" style=\"height:{{ breathSectionH }}; position:relative; background:#F8F7F4;\">\n    <div style=\"position:{{ breathStickyPos }}; top:0; min-height:100svh; display:grid; place-items:center; padding:clamp(96px,16vh,180px) clamp(20px,6vw,56px);\">\n      <div ref=\"{{ breathBoxRef }}\" style=\"width:min(94vw,1034px); text-align:center;\">\n        <h2 style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(1.9rem,4.4vw,3.3rem); line-height:1.38; letter-spacing:-0.006em; margin:0; color:rgb(206,203,196); text-wrap:pretty;\">\n          <span style=\"display:block; margin:0 0 0.32em;\"><span data-breath-word=\"\">Todo<\u002Fspan> <span data-breath-word=\"\">mundo<\u002Fspan> <span data-breath-word=\"\">promete<\u002Fspan> <span data-breath-word=\"\">velocidade.<\u002Fspan> <span data-breath-word=\"\">Tudo<\u002Fspan> <span data-breath-word=\"\">pronto<\u002Fspan> <span data-breath-word=\"\">pra<\u002Fspan> <span data-breath-word=\"\">ontem.<\u002Fspan><\u002Fspan>\n          <span style=\"display:block; margin:0 0 0.32em;\"><span data-breath-word=\"\">Como<\u002Fspan> <span data-breath-word=\"\">se<\u002Fspan> <span data-breath-word=\"\">você<\u002Fspan> <span data-breath-word=\"\">tivesse<\u002Fspan> <span data-breath-word=\"\">que,<\u002Fspan> <span data-breath-word=\"\">obrigatoriamente,<\u002Fspan> <span data-breath-word=\"\">escolher<\u002Fspan> <span data-breath-word=\"\">entre:<\u002Fspan><\u002Fspan>\n          <span style=\"display:block; margin:0 0 0.32em;\"><span data-breath-word=\"\">Entregar<\u002Fspan> <span data-breath-word=\"\">rápido<\u002Fspan> <span data-breath-word=\"\">e<\u002Fspan> <span data-breath-word=\"\">manter<\u002Fspan> <span data-breath-word=\"\">a<\u002Fspan> <span data-breath-word=\"\">sua<\u002Fspan> <span data-breath-word=\"\">própria<\u002Fspan> <span data-breath-word=\"\">autenticidade.<\u002Fspan><\u002Fspan>\n          <span style=\"display:block; margin:0 0 0.32em;\"><span data-breath-word=\"\">Mas<\u002Fspan> <span data-breath-word=\"\">você<\u002Fspan> <span data-breath-word=\"\">nunca<\u002Fspan> <span data-breath-word=\"\">precisou<\u002Fspan> <span data-breath-word=\"\">abrir<\u002Fspan> <span data-breath-word=\"\">mão<\u002Fspan> <span data-breath-word=\"\">de<\u002Fspan> <span data-breath-word=\"\">uma<\u002Fspan> <span data-breath-word=\"\">pra<\u002Fspan> <span data-breath-word=\"\">ter<\u002Fspan> <span data-breath-word=\"\">a<\u002Fspan> <span data-breath-word=\"\">outra.<\u002Fspan><\u002Fspan>\n          <span style=\"display:block; margin:0 0 0.32em;\"><span data-breath-word=\"\">A<\u002Fspan> <span data-breath-word=\"\">Cultiv<\u002Fspan> <span data-breath-word=\"\">escreve<\u002Fspan> <span data-breath-word=\"\">a<\u002Fspan> <span data-breath-word=\"\">partir<\u002Fspan> <span data-breath-word=\"\">de<\u002Fspan> <span data-breath-word=\"\">como<\u002Fspan> <span data-breath-word=\"\">você<\u002Fspan> <span data-breath-word=\"\">pensa.<\u002Fspan><\u002Fspan>\n          <span style=\"display:block;\"><span data-breath-word=\"\">No<\u002Fspan> <span data-breath-word=\"\">seu<\u002Fspan> <span data-breath-word=\"\">tempo,<\u002Fspan> <span data-breath-word=\"\">com<\u002Fspan> <span data-breath-word=\"\">as<\u002Fspan> <span data-breath-word=\"\">suas<\u002Fspan> <span data-breath-word=\"\">palavras.<\u002Fspan><\u002Fspan>\n        <\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ATO 5: PLANOS — \"Como eu compro\" (PRICING-SPEC) ============ -->\n  <!-- TODO(payments): confirmar domínio Auth0 real + returnTo da calibração; roteamento de checkout BRL→Asaas / USD→Stripe (packages/payments). Shape abaixo é o correto; valores exatos vêm de config no build. -->\n  <section id=\"planos\" data-screen-label=\"Planos — escolha por quanto você escreve\" aria-label=\"Planos\" style=\"background:#F8F7F4; color:var(--t-ink, #34322E); padding:clamp(88px,12vw,148px) clamp(20px,6vw,64px);\">\n    <div style=\"width:min(94vw,1120px); margin:0 auto;\">\n\n      <!-- cabeçalho -->\n      <div style=\"text-align:center; max-width:44ch; margin:0 auto;\">\n        <span style=\"display:inline-block; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--t-muted, #6B675F);\">Planos · sem cartão pra começar<\u002Fspan>\n        <h2 style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(2rem,4.4vw,3 lor 0.2s ease, color 0.2s ease;\" style-hover=\"border-color:#34322E;\">Comece o teste grátis →<\u002Fa>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n\n      <!-- nota fina -->\n      <p style=\"margin:clamp(24px,3vw,32px) 0 0; text-align:center; font-size:0.86rem; color:var(--t-muted, #6B675F);\">O cartão só entra quando você escolhe um plano.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ATO 6: FOUNDER-VÍDEO — \"Julgue você mesmo\" (FOUNDER-PROOF-SPEC) ============ -->\n  <!-- 2ª câmara escura. A inversão de cor reusa o MESMO mecanismo --t-* da constelação (mapa da\n       voz): dirigida por readScroll na entrada/saída da seção (§2 LANDING-FLOW). Nav e seções\n       vizinhas tingem de graça; o acid permanece invariante. -->\n  <section ref=\"{{ founderRef }}\" id=\"founder\" data-screen-label=\"Founder-vídeo — julgue você mesmo\" aria-label=\"Prova em vídeo: o fundador e o texto gerado pela Cultiv\" style=\"height:{{ fSectionH }}; position:relative;\">\n    <div ref=\"{{ founderStickyRef }}\" style=\"position:{{ fStickyPos }}; top:0; height:{{ fStickyH }}; overflow:{{ fStickyOverflow }}; display:flex; align-items:center; background:#F8F7F4; padding:clamp(40px,6vh,80px) clamp(20px,6vw,64px); box-sizing:border-box;\">\n      <div ref=\"{{ founderInnerRef }}\" style=\"width:min(94vw,1240px); margin:0 auto; position:relative; z-index:1; will-change:transform,opacity;\">\n\n      <!-- cabeçalho -->\n      <div style=\"max-width:56ch;\">\n        <span style=\"display:inline-flex; align-items:center; gap:9px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:#A8A399;\"><span style=\"width:7px; height:7px; border-radius:999px; background:#A3DD42; box-shadow:0 0 10px rgba(163,221,66,0.7);\"><\u002Fspan>Esta página foi escrita pela Cultiv<\u002Fspan>\n        <h2 style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(2rem,4.6vw,3.25rem); line-height:1.07; letter-spacing:-0.012em; margin:14px 0 0; color:#F1EFE9; text-wrap:balance;\">Veja um texto nascer. E leia o resultado inteiro.<\u002Fh2>\n      <\u002Fdiv>\n\n      <!-- split: vídeo | texto -->\n      <div style=\"display:flex; flex-direction:{{ fDir }}; gap:clamp(28px,3.6vw,58px); align-items:stretch; margin-top:clamp(34px,5vw,54px);\">\n\n        <!-- painel do vídeo -->\n        <div style=\"flex:{{ fVideoFlex }}; min-width:0; transition:flex-basis 0.72s cubic-bezier(0.22,1,0.36,1), flex-grow 0.72s cubic-bezier(0.22,1,0.36,1), flex-shrink 0.72s cubic-bezier(0.22,1,0.36,1);\">\n          <div style=\"position:relative; aspect-ratio:16/10; width:100%; max-height:52vh; margin:0 auto; border-radius:16px; overflow:hidden; border:1px solid rgba(241,239,233,0.14); background:#0E0E0C; box-shadow:0 30px 80px -40px rgba(0,0,0,0.8);\">\n\n            <!-- poster / frame (asset de vídeo a produzir) -->\n            <sc-if value=\"{{ fPosterShown }}\" hint-placeholder-val=\"{{ true }}\">\n              <div aria-hidden=\"true\" style=\"position:absolute; inset:0; background-image:repeating-linear-gradient(135deg, rgba(241,239,233,0.05) 0 10px, rgba(241,239,233,0.015) 10px 20px); display:grid; place-items:center;\">\n                <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; letter-spacing:0.06em; color:rgba(183,178,168,0.7); text-align:center; padding:0 24px; line-height:1.7;\">[ vídeo do fundador ]<br>rosto → prompt → geração da nota → resultado<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- idle: botão play -->\n            <sc-if value=\"{{ fPlayShown }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ fPlay }}\" aria-label=\"Assistir a nota do fundador sendo gerada\" style=\"position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(180deg, rgba(14,14,12,0) 40%, rgba(14,14,12,0.55)); border:none; cursor:pointer; color:#F1EFE9;\">\n                <span style=\"display:flex; flex-direction:column; align-items:center; gap:14px;\">\n                  <span style=\"width:74px; height:74px; border-radius:999px; background:#A3DD42; display:grid; place-items:center; box-shadow:0 14px 44px -14px rgba(163,221,66,0.75); transition:transform 0.2s ease;\" style-hover=\"transform:scale(1.06);\">\n                    <span style=\"width:0; height:0; border-left:20px solid #151512; border-top:13px solid transparent; border-bottom:13px solid transparent; margin-left:5px;\"><\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; letter-spacing:0.09em; color:#F1EFE9;\">assistir · 0:07<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n\n            <!-- vídeo rodando: geração acontecendo (stream em loop no clock do clipe) -->\n            <sc-if value=\"{{ fVideoLive }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute; inset:0; display:flex; flex-direction:column; padding:clamp(16px,2.6vw,26px); background:linear-gradient(180deg, rgba(14,14,12,0.35), rgba(14,14,12,0.86));\">\n                <span style=\"align-self:flex-start; display:inline-flex; align-items:center; gap:8px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; letter-spacing:0.08em; color:#151512; background:#A3DD42; padding:5px 11px; border-radius:999px;\">PROMPT · escreve por que criei a Cultiv<\u002Fspan>\n                <p style=\"margin:16px 0 0; font-family:'Fraunces',Georgia,serif; font-weight:440; font-size:clamp(1rem,1.7vw,1.24rem); line-height:1.5; color:#F1EFE9; text-wrap:pretty;\"><span ref=\"{{ fStreamRef }}\"><\u002Fspan><span style=\"display:inline-block; width:2px; height:1.05em; margin-left:2px; background:#A3DD42; vertical-align:-0.15em; animation:cultivCaret 0.9s steps(1) infinite;\"><\u002Fspan><\u002Fp>\n                <div style=\"flex:1;\"><\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:12px;\">\n                  <span style=\"display:inline-flex; align-items:center; gap:7px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; letter-spacing:0.08em; color:#A8A399; white-space:nowrap;\"><span style=\"width:6px; height:6px; border-radius:999px; background:#A3DD42; box-shadow:0 0 8px rgba(163,221,66,0.8);\"><\u002Fspan>gerando na voz do fundador<\u002Fspan>\n                  <div style=\"flex:1; height:3px; border-radius:999px; background:rgba(241,239,233,0.16); overflow:hidden;\"><div ref=\"{{ fProgressRef }}\" style=\"height:100%; width:0%; background:#A3DD42; border-radius:999px;\"><\u002Fdiv><\u002Fdiv>\n                  <button type=\"button\" sc-camel-on-click=\"{{ fReplay }}\" aria-label=\"Recomeçar do início\" style=\"flex:none; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; letter-spacing:0.08em; color:#F1EFE9; background:rgba(241,239,233,0.08); border:1px solid rgba(241,239,233,0.2); border-radius:999px; padding:6px 12px; cursor:pointer; transition:background-color 0.2s ease;\" style-hover=\"background:rgba(241,239,233,0.16);\">↺ recomeçar<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- painel do texto: a FounderNote, na íntegra -->\n        <div style=\"flex:{{ fTextFlex }}; min-width:0; opacity:{{ fTextOpacity }}; max-height:{{ fTextMax }}; overflow:hidden; pointer-events:{{ fTextPointer }}; transition:flex-basis 0.72s cubic-bezier(0.22,1,0.36,1), flex-grow 0.72s cubic-bezier(0.22,1,0.36,1), opacity 0.55s ease 0.18s, max-height 0.72s cubic-bezier(0.22,1,0.36,1);\">\n          <span style=\"display:block; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10.5px; letter-spacing:0.06em; color:#A8A399; text-transform:uppercase;\">A nota do fundador — gerada pela Cultiv, sem uma vírgula editada.<\u002Fspan>\n          <div style=\"margin-top:16px; display:flex; flex-direction:column; gap:14px;\">\n            <sc-for list=\"{{ founderNote }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <p style=\"margin:0; font-family:'Fraunces',Georgia,serif; font-weight:400; font-size:clamp(1rem,1.5vw,1.16rem); line-height:1.62; color:#E7E4DC; text-wrap:pretty;\">{{ p.text }}<\u002Fp>\n            <\u002Fsc-for>\n            <p style=\"margin:6px 0 0; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; letter-spacing:0.04em; color:#A8A399;\">— o fundador da Cultiv<\u002Fp>\n          <\u002Fdiv>\n          <a href=\"https://auth.cultiv.app/signup?plan=criador&amp;returnTo=%2Fcalibracao\" style=\"display:inline-flex; align-items:center; gap:8px; margin-top:clamp(22px,3vw,30px); text-decoration:none; font-family:inherit; font-weight:600; font-size:0.98rem; color:#151512; background:#A3DD42; border:1.5px solid #A3DD42; border-radius:10px; padding:13px 22px; transition:box-shadow 0.2s ease, transform 0.15s ease;\" style-hover=\"box-shadow:0 12px 30px -12px rgba(163,221,66,0.8); transform:translateY(-1px);\" style-active=\"transform:translateY(1px);\">Comece o teste grátis →<\u002Fa>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ATO 7: FAQ — \"derrubar as objeções\" (FAQ-SPEC) ============ -->\n  <!-- Cor: claro, calmo. Objection-handling: só as objeções que a narrativa não resolveu antes.\n       12 itens em <details> nativos, fechados por padrão, na ordem da §1 (dúvida mais forte\n       primeiro), agrupados por rótulo (Voz · Dados · Resultado · Escopo · Planos). Sem <h1>,\n       sem CTA acid concorrente (o único acid do fold é o do Ato 8). Nenhum preço hardcodado. -->\n  <section id=\"faq\" data-screen-label=\"FAQ — as dúvidas que todo mundo tem\" aria-label=\"Perguntas frequentes\" style=\"background:#F8F7F4; color:#34322E; padding:clamp(88px,13vw,150px) clamp(20px,6vw,56px); border-top:1px solid rgba(52,50,46,0.06);\">\n    <div style=\"width:min(92vw,780px); margin:0 auto;\">\n\n      <!-- cabeçalho -->\n      <div style=\"text-align:center; max-width:44ch; margin:0 auto clamp(40px,6vw,60px);\">\n        <span style=\"display:inline-block; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:#6B675F;\">FAQ · antes de você decidir<\u002Fspan>\n        <h2 style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(2rem,4.6vw,3.2rem); line-height:1.08; letter-spacing:-0.012em; margin:14px 0 0; color:#34322E;\">As dúvidas que todo mundo tem.<\u002Fh2>\n      <\u002Fdiv>\n\n      <!-- ===== Voz ===== -->\n      <p style=\"margin:0 0 4px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#A39E95;\">Voz<\u002Fp>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">Isso realmente soa como eu, ou é mais uma IA imitando?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">A calibração capta <em style=\"font-style:italic;\">como você raciocina e argumenta<\u002Fem> (Reasoning + Argument-Development Signature), não só a superfície do estilo. Não é uma IA genérica com um prompt bonito por cima — é o mapa do seu pensamento guiando cada texto.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">Preciso subir os meus textos antigos pra ele aprender?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">Não. A Cultiv <strong style=\"font-weight:600; color:#34322E;\">não raspa uploads<\u002Fstrong>. Ela te guia por <strong style=\"font-weight:600; color:#34322E;\">4 perguntas<\u002Fstrong> — você responde <em style=\"font-style:italic;\">escrevendo<\u002Fem>, em alguns minutos — e é isso que vira o seu Perfil de Voz.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <!-- ===== Dados ===== -->\n      <p style=\"margin:clamp(30px,4vw,44px) 0 4px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#A39E95;\">Dados e privacidade<\u002Fp>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">Vocês treinam com os meus textos? Meus dados ficam seguros?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">Não pra treinar nada de ninguém. Os textos que você escreve na calibração servem só pra montar o <em style=\"font-style:italic;\">seu<\u002Fem> Perfil de Voz — ficam <strong style=\"font-weight:600; color:#34322E;\">criptografados<\u002Fstrong> e ligados só à sua conta, e o texto cru <strong style=\"font-weight:600; color:#34322E;\">nunca é enviado ao modelo que escreve<\u002Fstrong>. A Cultiv gera a partir de sinais derivados da sua voz.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">A minha voz pode acabar no texto de outra pessoa?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">Não. Tudo o que é da sua voz fica ligado <strong style=\"font-weight:600; color:#34322E;\">só à sua conta<\u002Fstrong> — cada geração lê apenas a sua voz, e a Cultiv nunca a usa pra escrever pra outro usuário.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">E se eu mudar de ideia? Consigo apagar a minha voz?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">Consegue, quando quiser. Ao revogar o consentimento, a Cultiv <strong style=\"font-weight:600; color:#34322E;\">apaga tudo<\u002Fstrong> — os exemplos, o Perfil de Voz, as versões e os diagnósticos — e registra isso. Sua voz sai por completo.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <!-- ===== Resultado ===== -->\n      <p style=\"margin:clamp(30px,4vw,44px) 0 4px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#A39E95;\">Resultado<\u002Fp>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">O texto já sai pronto pra publicar, ou ainda preciso editar?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">Sai um <strong style=\"font-weight:600; color:#34322E;\">rascunho na sua voz<\u002Fstrong> — forte, mas não um carimbo final. Você continua sendo o autor: lê, ajusta o que quiser e publica. A Cultiv acelera a escrita; ela não tira você da decisão.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">E se a voz sair errada?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">Você recalibra. O Perfil de Voz é <strong style=\"font-weight:600; color:#34322E;\">durável e ajustável<\u002Fstrong> — não é um chute de uma vez só.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <!-- ===== Escopo ===== -->\n      <p style=\"margin:clamp(30px,4vw,44px) 0 4px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#A39E95;\">Escopo<\u002Fp>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">O que eu consigo escrever com ele?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">Você começa pelo que quer <em style=\"font-style:italic;\">dizer<\u002Fem> — compartilhar uma ideia, explicar a fundo, engajar, contar uma história, atualizar assinantes ou registrar uma decisão. O canal (blog, e-mail, social, rede profissional) é um ajuste opcional, não um template a preencher.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">Dá pra ter uma voz diferente pra cada canal?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">Hoje a Cultiv aprende <strong style=\"font-weight:600; color:#34322E;\">uma<\u002Fstrong> voz: a sua. Ela é durável e você a afina recalibrando — não é um perfil por canal. O que muda entre um post e um e-mail é a <em style=\"font-style:italic;\">intenção<\u002Fem> e o formato, não a sua voz.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <!-- ===== Planos ===== -->\n      <p style=\"margin:clamp(30px,4vw,44px) 0 4px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#A39E95;\">Planos<\u002Fp>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">O que é o teste grátis? Preciso de cartão?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\"><strong style=\"font-weight:600; color:#34322E;\">Não precisa de cartão pra começar<\u002Fstrong>, e o teste é o produto <strong style=\"font-weight:600; color:#34322E;\">inteiro<\u002Fstrong> (Perfil de Voz completo, todos os formatos, a mesma qualidade dos planos). Vai até <strong style=\"font-weight:600; color:#34322E;\">7 dias ou 5 gerações<\u002Fstrong>, o que vier primeiro. O cartão só entra quando você escolhe um plano.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">O que acontece quando o teste acaba? Qual plano eu escolho?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\"><strong style=\"font-weight:600; color:#34322E;\">Nada é cobrado sozinho<\u002Fstrong>: a geração pausa e a sua conta, voz e histórico ficam preservados até você escolher um plano. São três — Explorador, Criador e Profissional — e a diferença é <strong style=\"font-weight:600; color:#34322E;\">quanto você gera por mês<\u002Fstrong> e os modelos disponíveis. O Criador é o melhor equilíbrio pra maioria, e dá pra trocar depois.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-faq=\"\" style=\"border-top:1px solid rgba(52,50,46,0.12); border-bottom:1px solid rgba(52,50,46,0.12);\">\n        <summary style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 2px; cursor:pointer;\">\n          <span style=\"font-weight:600; font-size:clamp(1.02rem,2vw,1.16rem); line-height:1.42; letter-spacing:-0.006em; color:#34322E;\">Funciona em português e em inglês?<\u002Fspan>\n          <span data-sign=\"\" aria-hidden=\"true\" style=\"flex:none; position:relative; width:18px; height:18px; color:#8C877E;\">\n            <span style=\"position:absolute; top:50%; left:0; width:100%; height:1.5px; background:currentColor; transform:translateY(-50%);\"><\u002Fspan>\n            <span style=\"position:absolute; left:50%; top:0; width:1.5px; height:100%; background:currentColor; transform:translateX(-50%);\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fsummary>\n        <div data-answer=\"\" style=\"padding:0 2px 24px; max-width:66ch;\">\n          <p style=\"margin:0; font-size:clamp(0.98rem,1.7vw,1.05rem); line-height:1.62; color:#6B675F; text-wrap:pretty;\">A Cultiv <strong style=\"font-weight:600; color:#34322E;\">escreve em português e inglês<\u002Fstrong>. As perguntas da calibração hoje são em português; a leitura e a geração cobrem os dois idiomas.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ATO 8: CTA FINAL — \"Comece agora\" (CTA-FOOTER-SPEC) ============ -->\n  <!-- Cor: claro (travado na spec). Um último mergulho no escuro diluiria as câmaras de prova.\n       Sinal único: o botão acid é o ÚNICO acid do fold — nenhum link concorrente. -->\n  <section id=\"cta-final\" data-screen-label=\"CTA final — comece agora\" aria-label=\"Comece agora\" style=\"background:#F8F7F4; color:#34322E; padding:clamp(104px,17vw,196px) clamp(20px,6vw,56px); border-top:1px solid rgba(52,50,46,0.06);\">\n    <div ref=\"{{ ctaRevealRef }}\" style=\"width:min(92vw,760px); margin:0 auto; text-align:center;\">\n      <h2 style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(2.1rem,5.4vw,3.7rem); line-height:1.1; letter-spacing:-0.015em; margin:0; color:#34322E; text-wrap:balance;\">A sua voz não devia sumir só porque você precisa publicar mais.<\u002Fh2>\n      <div style=\"display:flex; justify-content:center; margin-top:clamp(34px,5vw,48px);\">\n        <a href=\"https://auth.cultiv.app/signup?returnTo=%2Fcalibracao\" style=\"display:inline-block; text-decoration:none; font-weight:600; font-size:1.06rem; color:#34322E; background:#A3DD42; border-radius:10px; padding:16px 30px; transition:background-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;\" style-hover=\"background:#34322E; color:#F8F7F4; transform:translateY(-2px); box-shadow:0 12px 34px rgba(163,221,66,0.38);\" style-active=\"transform:translateY(0);\" style-focus=\"outline:2.5px solid #34322E; outline-offset:3px;\">Comece o teste grátis →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ ATO 9: FOOTER — \"Por que eu lembro disso\" (CTA-FOOTER-SPEC) ============ -->\n  <!-- Bloco ESCURO-base (o \"chão\" da página): o CTA final é claro; o footer é o escuro logo abaixo.\n       Fecha com a linha de crença (beat memorável), depois colunas utilitárias em peso baixo.\n       Um só acid na tela — só em hover/realce; o verde-limão é a única cor saturada. -->\n  <footer data-screen-label=\"Footer — por que eu lembro disso\" aria-label=\"Rodapé\" style=\"background:oklch(0.16 0 0); color:oklch(0.93 0 0); padding:clamp(72px,11vw,116px) clamp(20px,6vw,56px) clamp(34px,4vw,52px);\">\n    <div ref=\"{{ footerRevealRef }}\" style=\"width:min(92vw,1120px); margin:0 auto;\">\n      <!-- a linha de crença: o beat memorável -->\n      <p style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:clamp(1.9rem,4.6vw,2.9rem); line-height:1.12; letter-spacing:-0.012em; margin:0; color:oklch(0.93 0 0); text-wrap:balance; max-width:18ch;\">A sua voz não é um estilo. É como você pensa.<\u002Fp>\n\n      <div style=\"height:1px; background:oklch(0.285 0 0); margin:clamp(38px,6vw,58px) 0;\"><\u002Fdiv>\n\n      <!-- grid de colunas: Marca (larga) · Produto · Legal · Redes -->\n      <div style=\"display:flex; flex-wrap:wrap; gap:clamp(32px,5vw,64px);\">\n        <!-- Marca -->\n        <div style=\"flex:1 1 260px; min-width:220px;\">\n          <div style=\"display:flex; align-items:center; gap:10px;\">\n            <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 96 96\" fill=\"none\" aria-hidden=\"true\" style=\"display:block;\">\n              <defs><path id=\"footerQ\" d=\"M62 38c0-9.5-7-16-15.5-16C38 22 32 28.2 32 36.2c0 7.9 6 13.8 14 13.8 1.1 0 2.2-.1 3.2-.4C48 60 42.2 65.6 34.6 68.2l3.4 6.8C50.6 70.6 62 59.6 62 43.6Z\"><\u002Fpath><\u002Fdefs>\n              <circle cx=\"48\" cy=\"48\" r=\"37\" stroke=\"oklch(0.93 0 0)\" stroke-width=\"5\" transform=\"rotate(-52 48 48)\"><\u002Fcircle>\n              <path d=\"M54.4 11.6A37 37 0 0 1 78.3 26.8\" stroke=\"oklch(0.83 0.19 128)\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath>\n              <use href=\"#footerQ\" transform=\"translate(26.5 31.6) scale(0.62) translate(-32 -22)\" fill=\"oklch(0.93 0 0)\"><\u002Fuse>\n              <use href=\"#footerQ\" transform=\"translate(51 31.6) scale(0.62) translate(-32 -22)\" fill=\"oklch(0.93 0 0)\"><\u002Fuse>\n            <\u002Fsvg>\n            <span style=\"font-family:'Instrument Serif',Georgia,serif; font-weight:400; font-size:1.5rem; letter-spacing:-0.01em; color:oklch(0.93 0 0);\">Cultiv<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0; font-famil tter-spacing:0.08em; text-transform:uppercase; color:oklch(0.70 0 0);\">Legal<\u002Fspan>\n          <ul style=\"list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:11px;\">\n            <li><a href=\"/privacidade\" style=\"font-weight:500; font-size:0.98rem; color:oklch(0.93 0 0); text-decoration:none;\" style-hover=\"color:oklch(0.83 0.19 128); text-decoration:underline; text-decoration-color:oklch(0.83 0.19 128); text-underline-offset:3px;\" style-focus=\"outline:2px solid oklch(0.83 0.19 128); outline-offset:3px; border-radius:2px;\">Privacidade<\u002Fa><\u002Fli>\n            <li><a href=\"/termos\" style=\"font-weight:500; font-size:0.98rem; color:oklch(0.93 0 0); text-decoration:none;\" style-hover=\"color:oklch(0.83 0.19 128); text-decoration:underline; text-decoration-color:oklch(0.83 0.19 128); text-underline-offset:3px;\" style-focus=\"outline:2px solid oklch(0.83 0.19 128); outline-offset:3px; border-radius:2px;\">Termos<\u002Fa><\u002Fli>\n            <li><a href=\"#\" style=\"font-weight:500; font-size:0.98rem; color:oklch(0.93 0 0); text-decoration:none;\" style-hover=\"color:oklch(0.83 0.19 128); text-decoration:underline; text-decoration-color:oklch(0.83 0.19 128); text-underline-offset:3px;\" style-focus=\"outline:2px solid oklch(0.83 0.19 128); outline-offset:3px; border-radius:2px;\">Falar com a gente<\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fnav>\n\n        <!-- Redes (placeholders) -->\n        <nav aria-label=\"Redes\" style=\"flex:1 1 140px; min-width:130px;\">\n          <span style=\"display:block; font-weight:600; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; color:oklch(0.70 0 0);\">Redes<\u002Fspan>\n          <div style=\"margin-top:16px; display:flex; gap:12px;\">\n            <a href=\"#\" aria-label=\"Instagram\" style=\"width:38px; height:38px; border-radius:999px; border:1px solid oklch(0.285 0 0); display:grid; place-items:center; text-decoration:none; color:ok 002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ ABERTURA: a logo se constrói no centro ============ -->\n  <sc-if value=\"{{ showIntro }}\" hint-placeholder-val=\"{{ false }}\">\n    <div aria-hidden=\"true\" style=\"position:fixed; inset:0; z-index:60; display:grid; place-items:center; pointer-events:none;\">\n      <div style=\"position:absolute; inset:0; background:#F8F7F4; opacity:{{ introBgOp }}; transition:opacity 0.9s cubic-bezier(0.25,0.1,0.25,1);\"><\u002Fdiv>\n      <div ref=\"{{ introLogoRef }}\" data-cultiv-intro-logo=\"true\" style=\"position:relative; transform:{{ introLogoT }}; opacity:{{ introLogoOp }}; transition:transform 0.95s cubic-bezier(0.16,1,0.3,1), opacity 0.75s cubic-bezier(0.25,0.1,0.25,1);\">\n        <svg width=\"min(30vw, 210px)\" height=\"min(30vw, 210px)\" sc-camel-view-box=\"0 0 96 96\" fill=\"none\" style=\"display:block;\">\n          <defs><path id=\"introQ\" d=\"M62 38c0-9.5-7-16-15.5-16C38 22 32 28.2 32 36.2c0 7.9 6 13.8 14 13.8 1.1 0 2.2-.1 3.2-.4C48 60 42.2 65.6 34.6 68.2l3.4 6.8C50.6 70.6 62 59.6 62 43.6Z\"><\u002Fpath><\u002Fdefs>\n          <circle cx=\"48\" cy=\"48\" r=\"37\" stroke=\"#151515\" stroke-width=\"5\" stroke-dasharray=\"233\" stroke-dashoffset=\"233\" transform=\"rotate(-52 48 48)\" style=\"animation:cultivDraw 0.9s cubic-bezier(0.25,0.1,0.25,1) forwards;\"><\u002Fcircle>\n          <path d=\"M54.4 11.6A37 37 0 0 1 78.3 26.8\" stroke=\"#95CB3E\" stroke-width=\"5\" stroke-dasharray=\"30\" stroke-dashoffset=\"30\" style=\"animation:cultivDraw 0.5s 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;\"><\u002Fpath>\n          <use href=\"#introQ\" transform=\"translate(26.5 31.6) scale(0.62) translate(-32 -22)\" fill=\"#151515\" opacity=\"0\" style=\"animation:cultivFadeIn 0.5s 0.4s cubic-bezier(0.25,0.1,0.25,1) forwards;\"><\u002Fuse>\n          <use href=\"#introQ\" transform=\"translate(51 31.6) scale(0.62) translate(-32 -22)\" fill=\"#151515\" opacity=\"0\" style=\"animation:cultivFadeIn 0.5s 0.55s cubic-bezier(0.25,0.1,0.25,1) forwards;\"><\u002Fuse>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;intro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamento&quot;},&quot;scrub&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Dev&quot;}}\">\nclass Component extends DCLogic {\n  /* =====================================================================\n     CULTIV — HERO SCROLL-STORY v5\n     (Direction Update: Character Style & Brand Reveal — ink transformation)\n     ---------------------------------------------------------------------\n     PERSONAGENS  Figuras humanas editoriais (proporções naturais, roupas,\n                  cabelos, tons de pele, acessórios). Personalidade só por\n                  postura, silhueta, roupa, ritmo e direção.\n     TIMELINE  (scrollProgress p ∈ [0,1])\n\n     abertura     ATO 0  A logo se constrói no CENTRO e voa para o nav.\n     p 0.00–0.16  ATO 1  Vozes únicas caminham. H1+CTA visíveis.\n     p 0.17–0.36  ATO 2  Captura escalonada → grade cinza em uníssono.\n     p 0.42–0.57  ATO 3  Ripple de restauração; cada um retoma cor e segue\n                         seu caminho. Overlay 3 no pico da recuperação.\n     p 0.585–0.75 ATO 4  DISSOLUÇÃO EM TINTA: um a um, cada personagem para,\n                         perde definição e escorre até virar uma poça de\n                         pigmento com a SUA paleta — a poça NASCE do corpo\n                         derretendo (cresce embaixo dele, nada é desenhado\n                         por cima). Câmera sobe suave; tudo aquieta.\n     p ~0.65–0.85 ATO 5  FLUXO: as poças se esticam e viajam; ao se tocarem\n                         os pigmentos se misturam (composite multiply).\n                         A tinta escoa por canais invisíveis que seguem a\n                         geometria EXATA do SVG oficial da marca.\n     ordem de pintura:   1) anel externo (0.735–0.802)\n                         2) acento verde (0.803–0.852)\n                         3) aspas internas (0.848–0.892)\n                         Traço molhado: carimbos com borda ondulada + cabeça\n                         de tinta; a ondulação seca até a geometria exata.\n     p 0.895–0.935       A tinta seca: camada molhada dá lugar ao SVG\n                         oficial (r37, stroke 5/37, #151515 / #95CB3E) sem\n                         mudança geométrica.\n     p 0.945–0.98        Selo assenta acima da headline.\n     p 0.95–0.99         Só então a copy entra (hold antes do fade).\n     p ≥ 0.96            Estado permanente: pessoas nascem do selo.\n     reduced-motion:     cena estática única fora da zona de segurança.\n     ===================================================================== */\n  constructor(props) {\n    super(props);\n    const reduced = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const intro = (props.intro ?? true) && !reduced;\n    this.DEMO_EXAMPLE = 'Eu reescrevo tudo. Não por perfeccionismo — por ritmo. Uma frase curta abre espaço; a seguinte estica, respira, dá a volta e só então entrega o que veio entregar. É assim que eu penso, e é assim que eu quero soar. Sabe quando um texto parece falado? Era isso que eu procurava nos meus rascunhos, e quase nunca achava.';\n    /* FounderNote — texto único (verbatim): o mesmo no \"vídeo\" e na leitura.\n       Gerado pela Cultiv a partir do Perfil de Voz do fundador; zero edição. */\n    this.FOUNDER_NOTE = [\n      'Passei anos escrevendo pra internet e detestando quase tudo que eu publicava. Não porque estava errado — estava correto, otimizado, redondo. Só não era meu. Toda vez que eu abria uma ferramenta de IA, saía de lá soando como todo mundo: o mesmo entusiasmo morno, as mesmas três palavras que ninguém fala em voz alta.',\n      'A Cultiv nasceu de uma teimosia simples: e se a máquina aprendesse como eu penso, em vez de me ensinar a pensar como ela? Não o meu tom médio — o meu jeito de virar uma frase, de cortar no meio, de deixar uma pausa antes da parte que importa.',\n      'Isso que você está lendo foi gerado pela Cultiv a partir do meu Perfil de Voz. Não editei uma vírgula. Se soa como uma pessoa, e não como um modelo, é exatamente esse o ponto — e é a única prova que eu confio pra te mostrar.',\n      'Você não precisa acreditar em mim. Cola um parágrafo seu, calibra a sua voz, e julga com os próprios olhos.'\n    ];\n    /* palavras da 1ª frase — usadas no stream de \"geração\" dentro do vídeo */\n    this.F_STREAM = this.FOUNDER_NOTE[0].split(' ');\n    this.F_CLIP = 7.4;   /* duração do clipe simulado (s) */\n    this.F_CUE = 3.4;    /* cue point: instante em que o resultado é revelado (split) */\n\n    this.state = {\n      phase: intro ? 'draw' : 'done', reduced, scrolled: false, navReady: !intro,\n      demoText: this.DEMO_EXAMPLE,\n      demoError: '',\n      demoReading: null,\n      cMobile: false,\n      /* Ato 6 — founder-vídeo (island): idle → play → split */\n      fPhase: reduced ? 'split' : 'idle',\n      fT: 0,\n    };\n\n    this.introRef = React.createRef();\n    this.stickyRef = React.createRef();\n    this.canvasRef = React.createRef();\n    this.heroCopyRef = React.createRef();\n    this.act2Ref = React.createRef();\n    this.act3Ref = React.createRef();\n    this.demoRef = React.createRef();\n    this.scrubRef = React.createRef();\n    this.scrubValRef = React.createRef();\n    this.navBrandRef = React.createRef();\n    this.introLogoRef = React.createRef();\n    this.breathRef = React.createRef();\n    this.breathBoxRef = React.createRef();\n    this.walkerRef = React.createRef();\n    this.founderRef = React.createRef();\n    this.founderStickyRef = React.createRef();\n    this.founderInnerRef =
